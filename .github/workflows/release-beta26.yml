name: Release beta.26

on:
  push:
    branches:
      - v2-control-plane
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release beta.26'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
            artifact: swish-control-macos-beta26
          - os: windows-latest
            command: npm run dist:win
            artifact: swish-control-windows-beta26
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout beta.26
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile native AVFoundation + Vision helper
        if: runner.os == 'macOS'
        run: swiftc native/VisionOCR.swift -O -framework Vision -framework AVFoundation -framework CoreGraphics -o native/vision-ocr

      - name: Validate
        run: npm run check

      - name: Build
        run: ${{ matrix.command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release beta.26'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish v2.0.0-beta.26
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-beta.26
          name: Swish Control v2.0.0-beta.26
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Swish Control beta.26.

            Adds completed-clip delivery with Shade share links.
            Clip Slack notifications now wait until all required backend data is ready:
            player recognition has completed, Shade has confirmed the clip, and the exact
            Shade share URL has been attached. Slack sends one final message only, with
            DATE/Time, Player, Shade: Saved, and Link.

            Shade share links are accepted through an authenticated backend callback and
            matched to the correct clip by filename/path. Existing OBS save paths, room
            CONTENT/CLIPS routing, Shade copying, and native AVFoundation/Vision OCR remain unchanged.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe

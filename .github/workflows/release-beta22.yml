name: Release beta.22

on:
  push:
    branches:
      - v2-control-plane
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release beta.22'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
            artifact: swish-control-macos-beta22
          - os: windows-latest
            command: npm run dist:win
            artifact: swish-control-windows-beta22
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout beta.22
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile Apple Vision OCR helper
        if: runner.os == 'macOS'
        run: swiftc native/VisionOCR.swift -O -framework Vision -framework ImageIO -o native/vision-ocr

      - name: Validate
        run: npm run check

      - name: Build
        run: ${{ matrix.command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release beta.22'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish v2.0.0-beta.22
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-beta.22
          name: Swish Control v2.0.0-beta.22
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Swish Control beta.22.

            Replaces cloud clip-image recognition with local Apple Vision OCR on macOS.
            Replay frames remain on the room Mac, temporary OCR frames are deleted after
            processing, and only the final player-name result is sent to Swish Control.
            Existing OBS save paths, room CONTENT/CLIPS routing, and Shade copying are unchanged.
            Slack continues to show Player: <name> and no longer shows the Replay Buffer trigger.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe

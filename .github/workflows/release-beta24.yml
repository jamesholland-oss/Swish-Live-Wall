name: Release beta.24

on:
  push:
    branches:
      - v2-control-plane
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release beta.24'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
            artifact: swish-control-macos-beta24
          - os: windows-latest
            command: npm run dist:win
            artifact: swish-control-windows-beta24
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout beta.24
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile Apple Vision OCR helper
        if: runner.os == 'macOS'
        run: swiftc native/VisionOCR.swift -O -framework Vision -framework ImageIO -o native/vision-ocr

      - name: Validate
        run: npm run check

      - name: Build
        run: ${{ matrix.command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release beta.24'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish v2.0.0-beta.24
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-beta.24
          name: Swish Control v2.0.0-beta.24
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Swish Control beta.24.

            Adds temporary OCR diagnostics to clip Slack alerts whenever the player
            cannot be identified. Diagnostics report sampled/captured frame counts,
            Apple Vision OCR line count, top locally recognized text, processing stage,
            and any local OCR error.

            Replay images remain local to the room Mac. Existing OBS save paths,
            room CONTENT/CLIPS routing, Shade copying, and clip filenames are unchanged.
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
